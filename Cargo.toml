[package]
name = "xiaomi_parts_ndk"
version = "0.2.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
android-ndk = { version = "0.7", features = ["android_support_34"] } # For compose-bridge FFI
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures = "0.3"
once_cell = "1"

[target.'cfg(target_os = "android")'.dependencies]
ndk-sys = "0.5"

[features]
default = []
debug = []
